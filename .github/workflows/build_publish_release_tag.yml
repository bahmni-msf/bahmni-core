name: Build and Publish package
on:
  push:
    tags:
      - 'msf-release-[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

jobs:
  build-publish-package:
    name: Build and Publish package
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v4
      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'corretto'
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7'
          bundler-cache: true
      - name: Install compass
        run: |
          sudo gem install compass -v 1.0.3
      - name: Build with Maven
        run: ./mvnw clean install -DskipTests

      - name: Set OMOD name and Release version
        run: |
          OMOD_PATH=$(ls -1 bahmnicore-omod/target/*.omod)
          OMOD_NAME=$(basename "$OMOD_PATH" .omod)
          RELEASE_VERSION=$(echo $GITHUB_REF_NAME | cut -d '-' -f 3)
          echo "OMOD_NAME=${OMOD_NAME}" >> $GITHUB_ENV
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.BAHMNI_LITE_AWS_UAT_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.BAHMNI_LITE_AWS_UAT_SECRET_KEY }}
          aws-region: ${{ secrets.BAHMNI_LITE_AWS_UAT_REGION }}

      - name: Upload OMOD
        run: aws s3 cp bahmnicore-omod/target/${{env.OMOD_NAME}}.omod s3://stable-artefacts/$GITHUB_REF_NAME/bahmni-core/latest/${{env.OMOD_NAME}}-${{env.RELEASE_VERSION}}.omod --region ${{ secrets.BAHMNI_LITE_AWS_UAT_REGION }} --acl public-read